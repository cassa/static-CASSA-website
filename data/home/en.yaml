intro:
  eyebrow: Intro
  title: What is CASSA?
  text: CASSA is an academic club that brings together Computer Science, Cyber Security, IT students, and Tech Enthusiasts alike. We run a variety of events, and even have a help desk at [Level 2, Building 18, Joondalup Campus](https://maps.app.goo.gl/D6ZhQREXi12gMt468)
  columns: 3
  items:
    - title: Technical Events
      desc: We run events such as Learn 2 Linux (L2L) that help you learn key computing/security skills either for fun, or the workforce.
      icon: fa-solid fa-gears
    - title: Social Events
      desc: We run events such as the Start of Semester Social (SOSS), to help you expand your network and meet like-minded indivduals.
      icon: fa-solid fa-users
    - title: Industry Events
      desc: We run events such as the Industry Connect, to help you learn from professionals, and ask them any questions you have.
      icon: fa-solid fa-briefcase

what:
  eyebrow: About CASSA
  title: Common Questions
  text: Common things people want to know about CASSA before joining
  items:
    - question: What is CASSA's purpose?
      answer: 
        The purpose of CASSA is to promote knowledge and understanding of computing and security in the ECU university community, through the organisation of events, workshops, and other activities that will foster learning and collaboration amount members.
        We strive to forge connections between you and teh future leaders and peers within your industry as well as the current industry leaders through our tailor made events.
      open: true
    - question: Who can join?
      answer: 
        All ECU students can join, you don't need to be studying a computing/security course to become a member, just be interested in tech/security
    - question: When did CASSA start?
      answer:
        CASSA started in 2003, but we don't have any records of back then, if you happen to have any records about CASSA from pre 2005, please let us know
    - question: Where is the CASSA desk?
      answer: 
        The CASSA desk is room 18.208, which is located at [Level 2, Building 18, Joondalup Campus](https://maps.app.goo.gl/D6ZhQREXi12gMt468)
    - question: What do I need to do to join?
      answer:
        All you need to do is fill out [this form](membership/), and join our [discord](https://discord.gg/6bmQ9NerwT)
    - question: How can I get answers to questions about CASSA?
      answer: 
        If your question isn't answered here, then we recommend asking on the CASSA discord where hopefully one of our members/execs can answer.
        If not you can email us at [executive@cassa.au](mailto:executive@cassa.au)
    - question: How can I sponsor CASSA?
      answer:
        Here at CASSA, we are grateful for all our sponsors who assist us and our members in having the best possible club experience.
        For any inquires, feel free to get in touch with us at [executive@cassa.au](mailto:executive@cassa.au?subject=Sponsorship%20inquiry)



join:
